plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"

}

// Upload-key credentials. Kept out of the repo — android/.gitignore already
// ignores key.properties, *.jks and *.keystore.
//
// When the file is absent (a fresh clone, CI without secrets), the release
// build falls back to debug signing so `flutter run --release` still works
// locally. That fallback is fine for development and NOT fine for Play: an
// upload signed with the debug key is rejected. See signingConfigs below.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.silitibum.app"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                // rootProject.file(), not file(). Inside this module a bare
                // file() resolves against android/app/, so a storeFile of
                // "upload-keystore.jks" pointed at android/app/upload-keystore.jks
                // and the build died with "Error: Missing keystore" while the
                // keystore sat next to key.properties in android/.
                // rootProject.file() resolves against android/ and still passes
                // an absolute path through unchanged.
                storeFile = rootProject.file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.silitibum.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24
        targetSdk = 36
        versionCode = 19
        versionName = '1.1.9'
    }

    buildTypes {
        release {
            // R8 code + resource shrinking. Keep rules live in
            // proguard-rules.pro, which deliberately keeps the reflection-heavy
            // SDKs (Zego, DeepAR, RevenueCat, flutter_local_notifications)
            // whole — R8 cannot see their runtime-resolved call sites, and a
            // wrongly-stripped class there fails only in a release build.
            //
            // If a release-only crash ever points at one of those SDKs, flip
            // both flags back to false to confirm before chasing it further.
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Real upload key when android/key.properties is present; debug key
            // otherwise so a keyless clone can still build and run.
            //
            // Verify what you actually produced before uploading — a
            // debug-signed AAB is rejected by Play with a message about the
            // certificate, not about this file:
            //   keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab
            // The owner must be your CN, not "CN=Android Debug".
            signingConfig = hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug

            // Symbolicates native crashes (DeepAR + Zego ship large .so files,
            // and without this their stack traces arrive in Play Console as
            // raw addresses).
            ndk {
                debugSymbolLevel = 'SYMBOL_TABLE'
            }
        }
    }

}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
flutter {
    source = "../.."
}
